<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rasio Ignite Legacy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#EEF3EC; --card:#FFFFFF; --fg:#13261C; --mute:#5C6E63; --line:#DCE5DD;
  --forest:#1F5C3D; --on-forest:#FFFFFF; --mint:#CFEBD9;
  --coral:#C0462E; --coral-bg:#FDE1DA;
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#0F1A14; --card:#172620; --fg:#E8F0EA; --mute:#9DB0A3; --line:#27382E;
    --forest:#6FCF97; --on-forest:#0F1A14; --mint:#1E3A2B;
    --coral:#F2735A; --coral-bg:#3A1F19;
  }
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--font-body);
  padding:20px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:14px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700}
h1{font:800 34px/1.02 var(--font-display);margin:4px 0 8px;text-wrap:balance}
h2{font:700 12px var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
h3{font:800 19px/1.2 var(--font-display);margin:0 0 6px;text-wrap:balance}
p{margin:0}
.sub{color:var(--mute);max-width:46ch}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);font:700 14px var(--font-body);padding:10px 12px;margin-bottom:-1px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--forest)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;min-width:0}
.f{display:grid;gap:4px}
.f label{font-size:14px;font-weight:500}
.f input{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:16px var(--font-body);padding:0 12px}
.f input::placeholder{color:var(--mute);opacity:.55;font-style:italic}
.f input.bad{border-color:var(--coral);border-width:2px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
button,input,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--forest);outline-offset:2px}
.btn{height:48px;border:0;border-radius:12px;background:var(--forest);color:var(--on-forest);font:700 15px var(--font-body);cursor:pointer;padding:0 18px;width:100%}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn[disabled]{opacity:.6;cursor:wait}
.err{color:var(--coral);font-size:13px;min-height:18px}
.hint{font-size:12px;color:var(--mute)}
.note{background:var(--coral-bg);color:var(--fg);border-radius:12px;padding:12px 14px;font-size:13px}
.ok{background:var(--mint);border-radius:16px;padding:18px;display:grid;gap:10px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font:800 28px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mute)}
.bars{display:grid;gap:8px}
.bar{display:grid;gap:5px;background:none;border:1px solid transparent;border-radius:10px;padding:6px;text-align:left;cursor:pointer;color:var(--fg);font:inherit;width:100%}
.bar[aria-pressed="true"]{border-color:var(--forest)}
.bar .top{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.bar .top b{font-variant-numeric:tabular-nums}
.track{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.fill{height:100%;border-radius:5px;background:var(--forest)}
.fill.hot{background:var(--coral)}
.fix{background:var(--coral-bg);border-radius:16px;padding:16px;display:grid;gap:8px}
.fix ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.fix.good{background:var(--mint)}
.fix .q{font-weight:700;font-size:14px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.row:first-child{border-top:0}
.row .nm{font-weight:700;overflow-wrap:anywhere}
.row .meta{font-size:12px;color:var(--mute);overflow-wrap:anywhere}
.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;background:var(--bg);border:1px solid var(--line)}
.chip.sehat{background:var(--mint);border-color:transparent}
.del{background:none;border:0;color:var(--mute);font:12px var(--font-body);cursor:pointer;text-decoration:underline;padding:4px}
.empty{text-align:center;padding:22px 8px;color:var(--mute);display:grid;gap:6px}
.empty b{color:var(--fg);font:800 18px var(--font-display)}
textarea.copybox{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:13px var(--font-body);padding:10px}
.sec-t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
@media (prefers-reduced-motion: no-preference){.ok{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Ignite · Garis Rikko</div>
    <h1>Rasio Ignite</h1>
    <p class="sub">Isi angka minggu lalu, sekali saja. Hasilnya dipakai untuk melihat di tahap mana tim paling sering macet.</p>
  </header>

  <nav class="tabs" role="tablist" aria-label="Tampilan">
    <button class="tab" role="tab" id="tabIsi" aria-selected="true" type="button">Isi data</button>
    <button class="tab" role="tab" id="tabAdmin" aria-selected="false" type="button">Lihat hasil</button>
  </nav>

  <section id="viewIsi" aria-labelledby="tabIsi">
    <div id="cfgNote" class="note" hidden>Halaman ini belum disambungkan ke penyimpanan. Isi saja, lalu salin hasilnya dan kirim ke leader.</div>
    <form id="form" class="card" novalidate></form>
    <div id="done" class="ok" hidden>
      <h3 id="doneT">Tersimpan</h3>
      <p>Terima kasih. Isianmu sudah masuk ke leader.</p>
      <button class="btn ghost" id="again" type="button">Isi lagi</button>
    </div>
    <div id="fallback" class="card" hidden>
      <p id="fbMsg"></p>
      <textarea class="copybox" id="fbText" readonly aria-label="Ringkasan isian"></textarea>
      <button class="btn" id="fbCopy" type="button">Salin hasil</button>
      <p class="hint" id="fbHint"></p>
    </div>
  </section>

  <section id="viewAdmin" hidden aria-labelledby="tabAdmin">
    <div id="adminMsg" class="note" hidden></div>
    <div id="adminWrap" hidden>
      <div id="adminBody" class="wrap" style="max-width:none"></div>
    </div>
  </section>
</div>

<script>
// Isi dengan URL Web app dari Apps Script (berakhiran /exec) setelah deploy.
var CONFIG={API:"https://script.google.com/macros/s/AKfycbxG4VwiuvgUHzmki6h9KtnYhquG-J4HkLn69EnSmMOB24f4omZQ_MmIhvq5Qg9zKMS2Dg/exec"};

var $=function(i){return document.getElementById(i)};
function h(t,a,c){var e=document.createElement(t);if(a)for(var k in a){if(k==='class')e.className=a[k];else if(k==='text')e.textContent=a[k];else e.setAttribute(k,a[k])}(c||[]).forEach(function(x){e.appendChild(typeof x==='string'?document.createTextNode(x):x)});return e}

var S={docs:[],filter:null,loaded:false};

var STAGES=[
 {n:'List tipis',t:'List nama masih tipis',fix:['Sesi 15 menit di Selasa: tiap orang menulis nama dari komunitas yang sudah diikuti (olahraga, hobi, alumni, sekolah anak, tempat ibadah).','Target 100 nama dan 5 hot prospek, list dikirim ke leader malam itu juga.'],q:'Untuk Selasa: audit list nama 10 menit, tiap orang menyebut jumlah namanya.'},
 {n:'Jumlah kontak',t:'Jumlah calon nasabah yang dihubungi kurang',fix:['Tulis jadwal telepon di kalender: hari dan jam, bukan niat.','Pasangkan dengan partner yang konsisten sebagai teman telepon.'],q:'Untuk Selasa: tiap orang menulis jadwal telepon mingguan, misalnya Kamis 19.00 untuk 5 orang.'},
 {n:'Cara mengajak',t:'Cara mengajak bertemu perlu dilatih',fix:['Role play 15 menit: prospek menjawab nanti dulu atau kirim info saja. Ulang 3 putaran.','Setelah role play, langsung telepon 3 orang.'],q:'Untuk Selasa: role play mengajak janji temu, lalu telepon bersama.'},
 {n:'Cerita konsep',t:'Pertemuan belum membawa cerita konsep',fix:['Latih cerita konsep 3 menit berpasangan.','Join field work supaya melihat leader membawakannya langsung.'],q:'Untuk Selasa: tiap orang menceritakan konsep 3 menit ke pasangannya.'},
 {n:'Closing',t:'Cerita ada, closing belum',fix:['Field work bareng leader di pertemuan kedua.','Latih menjawab keberatan: tanya dulu dari mana dia dengar itu.'],q:'Untuk Selasa: latihan menjawab keberatan dan jadwalkan field work.'},
 {n:'Sehat',t:'Alurnya sehat',fix:[],q:''}
];
function stageOf(e){
 if(e.ls<100||e.ht<5)return 0;
 if(e.nd<10)return 1;
 if(e.nb<5)return 2;
 if(e.nk<e.nb)return 3;
 if(e.nk>=3&&e.nc===0)return 4;
 return 5;
}

var F=[
 {g:'Siapa kamu',items:[['nm','Nama','text','Nama lengkap'],['up','Leader atau upline','text','Nama leader']]},
 {g:'List nama',items:[['ls','Jumlah nama di list (Project 100)','num'],['ht','Hot prospek di list','num']]},
 {g:'Calon nasabah, minggu lalu',items:[['nd','Yang dihubungi','num'],['nb','Yang jadi bertemu','num'],['nk','Cerita konsep dibawakan','num'],['nc','Closing (SPAJ)','num']]},
 {g:'Calon partner, minggu lalu',items:[['pd','Yang dihubungi','num'],['pb','Yang jadi bertemu','num'],['pt','BTL dibawakan','num'],['pn','NPA (keluar kode agen)','num']]}
];
var NUM=['ls','ht','nd','nb','nk','nc','pd','pb','pt','pn'];
var LBL={};

(function buildForm(){
 var f=$('form');
 F.forEach(function(g){
  f.appendChild(h('h2',{text:g.g}));
  var box=h('div',{class:g.g==='Siapa kamu'?'':'grid2'});
  if(g.g==='Siapa kamu'){box.style.display='grid';box.style.gap='10px'}
  g.items.forEach(function(it){
   var inp=h('input',{id:'f-'+it[0],type:it[2]==='num'?'number':'text',placeholder:it[2]==='num'?'Isi angka':it[3]});
   if(it[2]==='num'){inp.setAttribute('inputmode','numeric');inp.setAttribute('min','0')}
   LBL[it[0]]=it[1];
   box.appendChild(h('div',{class:'f'},[h('label',{for:'f-'+it[0],text:it[1]}),inp]));
  });
  f.appendChild(box);
 });
 f.appendChild(h('div',{class:'err',id:'err',role:'alert'}));
 f.appendChild(h('button',{class:'btn',type:'submit',id:'sendBtn',text:'Kirim jawaban'}));
 f.appendChild(h('p',{class:'hint',text:'Kalau belum ada angkanya, tulis 0.'}));
 f.addEventListener('input',function(ev){$('err').textContent='';if(ev.target&&ev.target.classList)ev.target.classList.remove('bad')});
 f.addEventListener('submit',function(ev){ev.preventDefault();submit()});
})();

function markBad(id,msg){
 var el=$('f-'+id);el.classList.add('bad');
 $('err').textContent=msg;
 el.focus();
 try{el.scrollIntoView({block:'center'})}catch(e){}
}
function readForm(){
 var r={nm:$('f-nm').value.trim(),up:$('f-up').value.trim()};
 for(var i=0;i<NUM.length;i++){r[NUM[i]]=Math.max(0,Math.round(Number($('f-'+NUM[i]).value)))}
 return r;
}
function summary(r){
 return 'Rasio Ignite | '+r.nm+' | leader: '+(r.up||'-')+' | list '+r.ls+', hot '+r.ht+' | nasabah: dihubungi '+r.nd+', bertemu '+r.nb+', cerita konsep '+r.nk+', closing '+r.nc+' | partner: dihubungi '+r.pd+', bertemu '+r.pb+', BTL '+r.pt+', NPA '+r.pn;
}
function showFallback(msg,r){
 $('fbMsg').textContent=msg;
 $('fbText').value=summary(r);
 $('fbHint').textContent='';
 $('fallback').hidden=false;
 $('form').hidden=true;
 $('fbCopy').onclick=function(){
  var t=$('fbText').value;
  var ok=function(){$('fbHint').textContent='Tersalin. Kirim ke leader lewat WhatsApp.'};
  var no=function(){$('fbText').focus();$('fbText').select();$('fbHint').textContent='Teks sudah terpilih. Salin lalu kirim ke leader lewat WhatsApp.'};
  try{navigator.clipboard.writeText(t).then(ok,no)}catch(e){no()}
 };
}
function call(body){
 return fetch(CONFIG.API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(function(r){return r.json()});
}
async function submit(){
 var all=['nm'].concat(NUM);
 all.forEach(function(k){$('f-'+k).classList.remove('bad')});
 if(!$('f-nm').value.trim()){markBad('nm','Isi namamu dulu.');return}
 for(var i=0;i<NUM.length;i++){
  var v=$('f-'+NUM[i]).value;
  if(v===''||isNaN(Number(v))||Number(v)<0){markBad(NUM[i],'Belum diisi: '+LBL[NUM[i]]+'. Kalau belum ada, tulis 0.');return}
 }
 var r=readForm();
 if(!CONFIG.API){showFallback('Halaman ini belum disambungkan ke penyimpanan. Salin hasilnya dan kirim ke leader.',r);return}
 var btn=$('sendBtn');btn.disabled=true;btn.textContent='Mengirim...';
 try{
  r.action='add';
  var j=await call(r);
  if(!j||!j.ok)throw new Error('server');
  $('doneT').textContent='Tersimpan, terima kasih '+r.nm;
  $('form').hidden=true;$('done').hidden=false;
 }catch(e){
  delete r.action;
  showFallback('Isianmu belum terkirim. Salin hasilnya dan kirim ke leader lewat WhatsApp, atau coba lagi nanti.',r);
 }finally{
  btn.disabled=false;btn.textContent='Kirim jawaban';
 }
}
$('again').onclick=function(){$('done').hidden=true;$('form').hidden=false;$('form').reset();$('f-nm').focus()};

function route(){
 var admin=location.hash==='#hasil';
 $('viewIsi').hidden=admin;$('viewAdmin').hidden=!admin;
 $('tabIsi').setAttribute('aria-selected',String(!admin));
 $('tabAdmin').setAttribute('aria-selected',String(admin));
 if(admin&&!S.loaded)loadAdmin();
}
$('tabIsi').onclick=function(){location.hash='isi'};
$('tabAdmin').onclick=function(){location.hash='hasil'};
window.addEventListener('hashchange',route);

function pct(a,b){return b>0?Math.round(a/b*100):0}
function sum(k){return S.docs.reduce(function(s,d){return s+(Number(d[k])||0)},0)}

function renderAdmin(){
 var B=$('adminBody');B.textContent='';
 var n=S.docs.length;
 var rf=h('button',{class:'btn ghost',type:'button',text:'Muat ulang data'});
 rf.onclick=function(){loadAdmin()};
 if(!n){
  B.appendChild(h('div',{class:'card'},[h('div',{class:'empty'},[h('b',{text:'Belum ada isian'}),h('p',{text:'Isian partner akan muncul di sini setelah ada yang mengirim. Tekan Muat ulang data untuk memperbarui.'})])]));
  B.appendChild(rf);
  return;
 }
 var counts=[0,0,0,0,0,0];
 S.docs.forEach(function(d){
  ['ls','ht','nd','nb','nk','nc','pd','pb','pt','pn'].forEach(function(k){d[k]=Number(d[k])||0});
  d._s=stageOf(d);counts[d._s]++;
 });

 var nd=sum('nd'),nb=sum('nb');
 var st=h('div',{class:'stats'});
 [[n,'partner mengisi'],[nd,'nasabah dihubungi'],[nb,'bertemu ('+pct(nb,nd)+'% dari dihubungi)'],[sum('nc'),'closing']].forEach(function(x){
  st.appendChild(h('div',{class:'stat'},[h('b',{text:String(x[0])}),h('span',{text:x[1]})]));
 });
 B.appendChild(st);

 var top=-1,mx=0;
 for(var i=0;i<5;i++){if(counts[i]>mx){mx=counts[i];top=i}}
 var bars=h('div',{class:'bars'});
 for(var j=0;j<6;j++){
  (function(j){
   var b=h('button',{class:'bar',type:'button','aria-pressed':String(S.filter===j)},[
    h('div',{class:'top'},[h('span',{text:STAGES[j].n}),h('b',{text:counts[j]+' ('+pct(counts[j],n)+'%)'})]),
    h('div',{class:'track'},[h('div',{class:'fill'+(j===top?' hot':''),style:'width:'+pct(counts[j],n)+'%'})])
   ]);
   b.onclick=function(){S.filter=S.filter===j?null:j;renderAdmin()};
   bars.appendChild(b);
  })(j);
 }
 B.appendChild(h('div',{class:'card'},[h('h2',{text:'Titik macet jalur calon nasabah'}),bars,h('p',{class:'hint',text:'Ketuk satu bar untuk menyaring daftar partner di bawah.'})]));

 if(top>=0){
  var s=STAGES[top];
  var ul=h('ul');s.fix.forEach(function(x){ul.appendChild(h('li',{text:x}))});
  B.appendChild(h('div',{class:'fix'},[
   h('div',{class:'eyebrow',text:'Paling banyak macet di sini'}),
   h('h3',{text:s.t}),
   h('p',{text:counts[top]+' dari '+n+' partner. Cara upgrade:'}),ul,
   h('p',{class:'q',text:s.q})
  ]));
 }else{
  B.appendChild(h('div',{class:'fix good'},[h('h3',{text:'Tidak ada tahap yang menonjol macet'}),h('p',{text:'Satu minggu belum membuktikan pola. Kumpulkan 4 minggu sebelum menyimpulkan.'})]));
 }

 var pc=h('div',{class:'stats'});
 [[sum('pd'),'calon partner dihubungi'],[sum('pb'),'bertemu'],[sum('pt'),'BTL dibawakan'],[sum('pn'),'NPA']].forEach(function(x){
  pc.appendChild(h('div',{class:'stat'},[h('b',{text:String(x[0])}),h('span',{text:x[1]})]));
 });
 B.appendChild(h('div',{class:'card'},[h('h2',{text:'Jalur calon partner (total tim)'}),pc,h('p',{class:'hint',text:'Dicatat dulu, belum ada diagnosa untuk jalur ini.'})]));

 var list=S.docs.slice().sort(function(a,b){return String(a.nm||'').localeCompare(String(b.nm||''))});
 if(S.filter!==null)list=list.filter(function(d){return d._s===S.filter});
 var lc=h('div',{class:'card'});
 var head=h('div',{class:'sec-t'},[h('h2',{text:S.filter===null?'Semua partner ('+list.length+')':STAGES[S.filter].n+' ('+list.length+')'})]);
 if(S.filter!==null){var clr=h('button',{class:'del',type:'button',text:'Tampilkan semua'});clr.onclick=function(){S.filter=null;renderAdmin()};head.appendChild(clr)}
 lc.appendChild(head);
 list.forEach(function(d){
  lc.appendChild(h('div',{class:'row'},[
   h('div',{},[h('div',{class:'nm',text:String(d.nm||'Tanpa nama')}),h('div',{class:'meta',text:(d.up?'Leader: '+d.up+' · ':'')+'list '+d.ls+', dihubungi '+d.nd+', bertemu '+d.nb+', closing '+d.nc})]),
   h('span',{class:'chip'+(d._s===5?' sehat':''),text:STAGES[d._s].n})
  ]));
 });
 lc.appendChild(h('p',{class:'hint',text:'Untuk menghapus isian, hapus barisnya langsung di Google Sheet.'}));
 B.appendChild(lc);

 var cp=h('button',{class:'btn ghost',type:'button',text:'Salin ringkasan untuk meeting'});
 var cpHint=h('p',{class:'hint'});
 cp.onclick=function(){
  var lines=['Rasio Ignite: '+n+' partner mengisi','Nasabah: '+nd+' dihubungi, '+nb+' bertemu ('+pct(nb,nd)+'%), '+sum('nc')+' closing','Titik macet:'];
  for(var k=0;k<6;k++)lines.push('- '+STAGES[k].n+': '+counts[k]);
  var t=lines.join('\n');
  try{navigator.clipboard.writeText(t).then(function(){cpHint.textContent='Tersalin.'},function(){cpHint.textContent='Penyalinan ditolak di tampilan ini.'})}catch(e){cpHint.textContent='Penyalinan ditolak di tampilan ini.'}
 };
 B.appendChild(cp);B.appendChild(cpHint);B.appendChild(rf);
 B.appendChild(h('p',{class:'hint',text:'Bacaan satu minggu, jadi masih dugaan. Ambang: 100 nama dan 5 hot prospek, 10 dihubungi, 5 bertemu (patokan Legacy), sisanya patokan awal.'}));
}

async function loadAdmin(){
 var m=$('adminMsg');m.hidden=true;
 if(!CONFIG.API){m.textContent='Halaman belum disambungkan ke penyimpanan.';m.hidden=false;return}
 m.textContent='Memuat data...';m.hidden=false;
 try{
  var j=await call({action:'list'});
  if(!j||!j.ok){m.textContent='Data tidak bisa dimuat.';return}
  S.docs=j.rows||[];S.loaded=true;
  m.hidden=true;$('adminWrap').hidden=false;
  renderAdmin();
 }catch(e){
  m.textContent='Tidak bisa menghubungi server. Cek koneksi lalu coba lagi.';
 }
}

if(!CONFIG.API)$('cfgNote').hidden=false;
route();
</script>
</body>
</html>
